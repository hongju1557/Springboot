<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/login" method="post">

           name="memberId"

</form>

<p th:if="${error}"
   th:text="${error}">
</p>
</body>
</html>
