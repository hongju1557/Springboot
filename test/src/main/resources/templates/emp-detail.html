<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>사원 상세</title>

    <link rel="stylesheet" th:href="@{/css/basic.css}">
    <link rel="stylesheet" th:href="@{/css/component.css}">
    <link rel="stylesheet" th:href="@{/css/app-shell.css}">
    <link rel="stylesheet" th:href="@{/css/hr.css}">
</head>
<body>

<main class="app-main container">

    <div class="page-head">
        <div>
            <h1>사원 상세정보</h1>
            <p>사원의 상세 정보를 확인합니다.</p>
        </div>

        <a class="btn btn--secondary"
           th:href="@{/emps}">
            목록으로
        </a>
    </div>


    <div class="card"
         style="padding: var(--space-6)">

        <div class="profile">

            <span class="avatar"
                  th:text="${#strings.substring(emp.empName, 0, 1)}">
            </span>

            <div>

                <h2 th:text="${emp.empName}"></h2>

                <p class="muted">
                    사번
                    <span th:text="${emp.empId}"></span>
                </p>

            </div>

        </div>

    </div>


    <div class="card mt-6"
         style="padding: var(--space-6)">

        <table class="info-table">

            <tr>
                <th>사원번호</th>
                <td th:text="${emp.empId}"></td>
            </tr>

            <tr>
                <th>이름</th>
                <td th:text="${emp.empName}"></td>
            </tr>

            <tr>
                <th>이메일</th>
                <td th:text="${emp.email}"></td>
            </tr>

            <tr>
                <th>부서</th>
                <td th:text="${emp.deptId}"></td>
            </tr>

            <tr>
                <th>직급</th>
                <td th:text="${emp.jobCode}"></td>
            </tr>

            <tr>
                <th>급여</th>
                <td th:text="${emp.salary}"></td>
            </tr>

            <tr>
                <th>입사일</th>
                <td th:text="${emp.hireDate}"></td>
            </tr>

        </table>

    </div>

</main>

</body>
</html>
